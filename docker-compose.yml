services:

  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:5173"
    env_file:
    - ./frontend/.env
    depends_on:
      - backend

  admin:
    build: ./admin
    container_name: ecommerce-admin
    ports:
      - "5174:5174"
    depends_on:
      - backend